name: build-binaries

on:
  workflow_dispatch:
    inputs:
      build_target:
        description: 'Which platforms to build'
        required: true
        default: android-all-and-darwin-x64
        type: choice
        options:
          - android-all-and-darwin-x64
          - android-all
          - darwin-x64
          - all-platforms

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go (for go env only)
        uses: actions/setup-go@v5
        with:
          go-version: '1.21.x'

      - name: Prepare Go env for Docker build
        run: |
          GOPATH="$(go env GOPATH)"
          GOCACHE="$(go env GOCACHE)"
          mkdir -p "$GOPATH" "$GOCACHE"
          echo "GOPATH=$GOPATH" >> "$GITHUB_ENV"
          echo "GOCACHE=$GOCACHE" >> "$GITHUB_ENV"

      - name: Fetch tags (for GIT_VERSION)
        run: |
          git fetch --tags --prune --unshallow || git fetch --tags

      - name: Build selected platforms
        run: |
          case "${{ github.event.inputs.build_target }}" in
            android-all-and-darwin-x64)
              make android-arm android-arm-shared \
                   android-arm64 android-arm64-shared \
                   android-x64 android-x64-shared \
                   android-x86 android-x86-shared \
                   darwin-x64
              ;;
            android-all)
              make android-arm android-arm-shared \
                   android-arm64 android-arm64-shared \
                   android-x64 android-x64-shared \
                   android-x86 android-x86-shared
              ;;
            darwin-x64)
              make darwin-x64
              ;;
            all-platforms)
              make all
              ;;
          esac

      - name: Upload build directory as artifact
        uses: actions/upload-artifact@v4
        with:
          name: elementum-build-${{ github.event.inputs.build_target }}
          path: build/